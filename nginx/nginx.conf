events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zone ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstreams ──
    upstream backend {
        server backend:5000;
    }

    upstream frontend {
        server host.docker.internal:3000;
    }

    # ──────────────────────────────────────────────────────
    # HTTP — Redirect all traffic to HTTPS
    # ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name dctech.space www.dctech.space;

        # Let's Encrypt challenge (must stay on port 80)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────
    # HTTPS — Main server block
    # ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name dctech.space www.dctech.space;

        # ── SSL Certificate paths (Let's Encrypt via Certbot) ──
        ssl_certificate     /etc/letsencrypt/live/dctech.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dctech.space/privkey.pem;

        # ── SSL Session ──
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Modern SSL protocols & ciphers ──
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # ── OCSP Stapling ──
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ── Security Headers ──
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Gzip Compression ──
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types application/json text/plain application/javascript text/css image/svg+xml;

        # ── Health check ──
        location /health {
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
        }

        # ── API Proxy ──
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            client_max_body_size 10m;
        }

        # ── Uploaded files ──
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Swagger API Docs ──
        location /api-docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Frontend (everything else) ──
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
