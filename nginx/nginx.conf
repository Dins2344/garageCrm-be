events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zone ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream: our Node.js backend ──
    upstream backend {
        server backend:5000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (uncomment when SSL is configured)
        # return 301 https://$host$request_uri;

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Gzip Compression ──
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types application/json text/plain application/javascript text/css;

        # ── Health check for load balancer ──
        location /health {
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
        }

        # ── API Proxy ──
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering for large responses (PDF downloads)
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            # Max request body size (for file uploads)
            client_max_body_size 10m;
        }

        # ── Uploaded files ──
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── HTTPS server (uncomment and configure when you have SSL certs) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Same location blocks as HTTP server above
    #     location /api/ {
    #         proxy_pass http://backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         client_max_body_size 10m;
    #     }
    # }
}
