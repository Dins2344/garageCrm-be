name: Deploy GarageFlow Backend

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  DOCKER_IMAGE: garageflow-api
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  # ── Job 1: Build & Test ──
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run health check test
        run: |
          echo "✅ Build successful — dependencies installed"

  # ── Job 2: Build Docker Image & Deploy ──
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE:${{ github.sha }} -t $DOCKER_IMAGE:latest .

      - name: Save Docker image as artifact
        run: |
          docker save $DOCKER_IMAGE:latest | gzip > garageflow-api.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "garageflow-api.tar.gz"
          target: "/home/${{ secrets.EC2_USER }}/deploy/"

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.EC2_USER }}/garageflow/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Loading Docker image..."
            docker load < ~/deploy/garageflow-api.tar.gz

            echo "📂 Moving to project directory..."
            cd ~/garageflow

            echo "🔄 Stopping old containers..."
            docker compose down --remove-orphans || true

            echo "🚀 Starting new containers..."
            docker compose up -d

            echo "⏳ Waiting for health check..."
            sleep 10

            echo "🩺 Checking health..."
            curl -sf http://localhost:5000/api/health || (echo "❌ Health check failed!" && docker compose logs backend && exit 1)

            echo "🧹 Cleaning up..."
            rm -f ~/deploy/garageflow-api.tar.gz
            docker image prune -f

            echo "✅ Deployment complete!"

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment succeeded for commit ${{ github.sha }}"
          else
            echo "❌ Deployment failed for commit ${{ github.sha }}"
          fi
