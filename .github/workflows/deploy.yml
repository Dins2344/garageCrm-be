name: Deploy GaragePulse Backend

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/garagepulse-api

jobs:
  # ── Job 1: Build & Push Docker Image ──
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ── Job 2: Deploy to EC2 ──
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.EC2_USER }}/garagepulse/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.1
        env:
          DOCKER_IMG: ${{ secrets.DOCKERHUB_USERNAME }}/garagepulse-api
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: DOCKER_IMG,DH_USER,DH_TOKEN
          script: |
            set -e

            echo "Logging into Docker Hub..."
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

            echo "Pulling latest image..."
            docker pull "${DOCKER_IMG}:latest"

            echo "Moving to project directory..."
            cd ~/garagepulse

            echo "Stopping old containers..."
            docker compose down --remove-orphans || true

            echo "Starting new containers..."
            DOCKER_IMAGE="${DOCKER_IMG}" docker compose up -d

            echo "⏳ Waiting for health check..."
            sleep 10

            echo "Checking health..."
            curl -sf http://localhost:5000/api/health || (echo "Health check failed!" && docker compose logs backend && exit 1)

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete!"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment succeeded for commit ${{ github.sha }}"
          else
            echo "Deployment failed for commit ${{ github.sha }}"
          fi
